services:
  # SQL Server Database
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ev-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./database/mssql/init:/docker-entrypoint-initdb.d
    networks:
      - ev_network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ev-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MongoDB for logs and analytics
  mongodb:
    image: mongo:7
    container_name: ev-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-mongoadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongopass123}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - ev_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u mongoadmin -p mongopass123 --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ev-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-rabbitmq}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-rabbitmq123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ev_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    init: true

  # Apache NiFi for ETL and data flow
  nifi:
    image: apache/nifi:1.23.2
    container_name: ev-nifi
    ports:
      - "${NIFI_PORT:-8080}:8080"
      - "${NIFI_HTTPS_PORT:-8443}:8443"
    volumes:
      - nifi-data:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/flow_templates:/opt/nifi/nifi-current/flow_templates:ro
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USER:-admin}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASS:-ctsCtDCC0KFeJfMT6O+4Ay2aB8vRm7k2B0JT5ym8va0=}
    networks:
      - ev_network
    depends_on:
      - mongodb
      - sql

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ev-auth-service
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=${SQL_HOST};Database=auth_db;User Id=${SQL_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-rabbitmq}
      - RabbitMQ__Password=${RABBITMQ_PASS:-rabbitmq123}
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
    ports:
      - "${AUTH_PORT:-5000}:80"
    networks:
      - ev_network

  # Gateway Service
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: ev-gateway-service
    depends_on:
      - auth-service
      - ownership-service
      - booking-service
      - payment-service
      - report-service
      - ai-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    networks:
      - ev_network

  # Ownership Service (merged from account-ownership-service and group-management-service)
  ownership-service:
    build:
      context: ./ownership-service
      dockerfile: Dockerfile
    container_name: ev-ownership-service
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=${SQL_HOST};Database=ownership_db;User Id=${SQL_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-rabbitmq}
      - RabbitMQ__Password=${RABBITMQ_PASS:-rabbitmq123}
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
      - GatewayUrl=http://gateway-service:80
    ports:
      - "${OWNERSHIP_PORT:-5001}:80"
    networks:
      - ev_network

  # Booking Service
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: ev-booking-service
    depends_on:
      sql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=${SQL_HOST};Database=booking_db;User Id=${SQL_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__MongoDB=mongodb://mongoadmin:mongopass123@mongodb:27017/booking_logs?authSource=admin
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-rabbitmq}
      - RabbitMQ__Password=${RABBITMQ_PASS:-rabbitmq123}
      - AIServiceUrl=http://ai-service:8000
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
    ports:
      - "${BOOKING_PORT:-5002}:80"
    networks:
      - ev_network

  # Payment Service
  payment-service:
    build:
      context: ./payment_service/payment-service
      dockerfile: Dockerfile
    container_name: ev-payment-service
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=${SQL_HOST};Database=payment_db;User Id=${SQL_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-rabbitmq}
      - RabbitMQ__Password=${RABBITMQ_PASS:-rabbitmq123}
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
    ports:
      - "${PAYMENT_PORT:-5003}:80"
    networks:
      - ev_network

  # Report Service (renamed from history-analytics-service)
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: ev-report-service
    depends_on:
      sql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      nifi:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=${SQL_HOST};Database=report_db;User Id=${SQL_USER:-sa};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__MongoDB=mongodb://mongoadmin:mongopass123@mongodb:27017/report_logs?authSource=admin
      - NiFiUrl=http://nifi:8080
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGeneration2024}
      - JWT__Issuer=${JWT_ISSUER:-EV-CoOwnership-System}
      - JWT__Audience=${JWT_AUDIENCE:-EV-CoOwnership-System}
    ports:
      - "${REPORT_PORT:-5004}:80"
    networks:
      - ev_network

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ev-ai-service
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongoadmin:mongopass123@mongodb:27017/ai_db?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "${AI_PORT:-8010}:8000"
    networks:
      - ev_network
    volumes:
      - ai-models:/app/models

  # Frontend (React + Vite + TailAdmin - Role-based)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ev-frontend
    depends_on:
      - gateway-service
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ev_network
    environment:
      - VITE_API_URL=http://gateway-service:80

volumes:
  sql-data:
  redis-data:
  mongo-data:
  mongo-config:
  rabbitmq-data:
  nifi-data:
  nifi-state:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  ai-models:

networks:
  ev_network:
    driver: bridge
